# Generated by spawn.py: content validation needs no sibling repositories.
# Full board tests require an adopted Brain checkout and are not run here.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: make validate
      - name: Wikilink report
        if: always()
        run: python scripts/validate_wikilinks.py --list
      - name: Content validator tests
        run: >-
          python -m pytest -q
          tests/test_validate_literature_citations.py
          tests/test_validate_structure.py
          tests/test_validate_wikilinks.py
