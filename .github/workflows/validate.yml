name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The family look (hero, palette, stylesheet) is defined once in the
      # Brain and imported by the renderer — never copied in here.
      - uses: actions/checkout@v4
        with:
          repository: YOURORG/PyAutoBrain
          path: PyAutoBrain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: make validate
      - run: make test
